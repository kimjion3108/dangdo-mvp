<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>카카오맵에서 장소 보기</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#202735;display:grid;place-items:center;min-height:100vh}main{max-width:380px;margin:24px;background:white;padding:30px;border-radius:22px}h1{font-size:24px}a{display:block;padding:16px;border-radius:12px;background:#fee500;text-align:center;color:#202735;text-decoration:none;font-weight:700}p{color:#71808d;line-height:1.6}</style><main><h1 id="place">공유한 장소</h1><p id="status">카카오맵으로 연결하고 있어요.</p><a id="open" hidden>카카오맵에서 보기</a></main><script>
const q=new URLSearchParams(location.search),lat=Number(q.get('lat')),lng=Number(q.get('lng')),name=(q.get('name')||'공유한 장소').slice(0,120),id=q.get('id')||'';document.getElementById('place').textContent=name;
if(q.has('lat')&&q.has('lng')&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180){const url=/^\d+$/.test(id)?'https://place.map.kakao.com/'+id:'https://map.kakao.com/link/map/'+encodeURIComponent(name)+','+lat+','+lng;const a=document.getElementById('open');a.href=url;a.hidden=false;location.replace(url);}else document.getElementById('status').textContent='장소 링크를 확인해 주세요.';
</script></html>
